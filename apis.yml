name: OSlash
description: 'OSlash is a productivity tool that lets teams create short, memorable
  shortcuts — typed as "o/" followed by a keyword — to instantly find and open their
  documents, dashboards, and internal tools across 100+ connected apps such as Salesforce,
  Notion, Jira, GitHub, Figma, Asana, HubSpot, and Linear. Delivered as a Chrome extension
  with enterprise features like SSO and bank-level encryption, OSlash was backed by
  Accel. As of this profile the public product is marked "Coming Soon" and the company
  publishes no developer API, SDK, OpenAPI spec, or documentation surface — this remains
  an enrichment lead with no scored API artifacts beyond a domain-security probe.'
